<style>
:root{--bg:#F2F4F1;--card:#FFFFFF;--ink:#0D1B14;--mut:#68756E;--line:#E7EBE6;--pri:#0F3D2E;--acc:#C8F03C;--ok:#1C8A57;--bad:#D14B3B;--chip:#EEF1ED;--sh:0 1px 2px rgba(13,27,20,.05),0 10px 28px rgba(13,27,20,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A130E;--card:#121F18;--ink:#EDF5EF;--mut:#8DA096;--line:#1F2F26;--ok:#4FD08C;--bad:#FF7F6E;--chip:#1A2A21;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0A130E;--card:#121F18;--ink:#EDF5EF;--mut:#8DA096;--line:#1F2F26;--ok:#4FD08C;--bad:#FF7F6E;--chip:#1A2A21;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Inter","SF Pro Display","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 124px}
h1,h2,.big{font-family:inherit;margin:0;letter-spacing:-.02em}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 2px 14px;gap:10px}
header h1{font-size:26px;font-weight:800}
header small{color:var(--mut);display:block;font-size:13px;margin-top:2px}
header select{width:auto;border-radius:999px;background:var(--card);border:1.5px solid var(--ink);padding:9px 14px;font-weight:600;font-size:13px}
.hero{background:linear-gradient(145deg,#0F3D2E 0%,#16583F 100%);color:#fff;border-radius:26px;padding:22px;margin-bottom:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(200,240,60,.12)}
.hero .big{font-size:40px;font-weight:800;color:#fff;line-height:1.1;margin-top:6px}
.hero p{margin:8px 0 0;opacity:.9;font-size:13px}
.hero p b{color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1.5px solid transparent;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.grid .card{margin:0;padding:16px}
.k{color:var(--mut);font-size:12.5px}
.v{font-weight:800;font-size:21px;letter-spacing:-.02em;margin-top:2px}
h2{font-size:17px;font-weight:800;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:13px 14px}
input:focus,select:focus{outline:none;border-color:#B5DE2B;box-shadow:0 0 0 3px rgba(200,240,60,.35)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 16px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card)}
.qty{display:flex;gap:8px}.qty button{width:54px;font-size:22px}.qty input{text-align:center;font-weight:700}
button.btn{width:100%;margin-top:18px;border:0;border-radius:18px;background:var(--acc);color:#0F3D2E;font-family:inherit;font-weight:800;font-size:16px;padding:16px;cursor:pointer;box-shadow:0 6px 16px rgba(160,200,20,.35)}
button.btn:active{transform:scale(.98)}
button.ghost{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;font-family:inherit;font-weight:600;cursor:pointer}
.sum{background:var(--chip);border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row small{color:var(--mut);display:block;font-size:12.5px;font-weight:400;margin-top:1px}
.row b{font-weight:800}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:rgba(209,75,59,.12);color:var(--bad)}
.bar{height:10px;border-radius:999px;background:var(--chip);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#B5DE2B,#C8F03C)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav div{display:flex;width:100%;max-width:452px;background:#0F3D2E;border-radius:28px;padding:6px;gap:4px;box-shadow:0 12px 32px rgba(8,30,22,.35);pointer-events:auto}
nav button{flex:1;border:0;background:none;color:#9FBBAE;font-family:inherit;font-size:11px;font-weight:600;padding:9px 0 8px;border-radius:22px;cursor:pointer}
nav button b{display:block;height:25px;font-weight:400}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 3px}
nav button.on{background:var(--acc);color:#0F3D2E}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0F3D2E;color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;box-shadow:0 10px 28px rgba(8,30,22,.35)}
#toast.show{opacity:1}
.note{color:var(--mut);font-size:12.5px;margin-top:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.g4>div{background:var(--chip);border-radius:14px;padding:10px 4px;text-align:center}.g4 b{display:block;font-size:13px;font-weight:800}
</style>

<body>
<div id="app">
<header><div><h1>Cahier Malin</h1><small id="hn">Ma boutique</small></div><select id="sec" aria-label="Secteur" onchange="setSec(this.value)" style="width:auto;padding:8px 10px"></select></header>
<main id="v"></main>
</div>
<nav><div id="nav"></div></nav>
<div id="toast" role="status"></div>
<script>
const ACT=false,DEMO=15,FIX=null;
const CAN5=["Boutique","WhatsApp","Facebook","Instagram","TikTok"];
const SECS={general:{n:"Ma Boutique",pack:0,stock:1,dette:1,art:"Article",can:["Boutique","WhatsApp","Facebook"]},mode:{n:"Atelier Mode",pack:1,stock:1,art:"Article",can:CAN5},beauty:{n:"Beauty Gestion",pack:1,stock:1,art:"Produit",can:CAN5},phone:{n:"Cabine Plus",pack:0,stock:1,cap:1,art:"Modèle",can:CAN5},resto:{n:"Resto Rapide",pack:0,stock:0,dette:1,art:"Plat",can:["Sur place","À emporter","Livraison","WhatsApp"]}};
const CATS=["Loyer","Transport","Emballage","Communication","Salaire","Autre"];
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(Math.round(n)<0?"−":"")+Math.abs(Math.round(n)).toLocaleString("fr-FR").replace(/\u202f/g," ")+" F";
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let SID=FIX||ls("cm-sec"),G=ls("cm-g")||{nom:"",lic:""},S,F,tab="home";if(!SECS[SID])SID="general";let chosen=!!(FIX||ls("cm-sec"));
const SC=()=>SECS[SID],cats=()=>SC().stock?CATS:["Gaz / charbon","Loyer","Transport","Salaire","Eau / électricité","Autre"];
const empty=()=>({ouv:0,hist:{},art:[],ven:[],rea:[],dep:[],pay:[],cnt:{}});
const load=()=>{S=ls("cm-"+SID);if(!S||!S.art)S=empty();S.pay=S.pay||[];S.cnt=S.cnt||{}};
const save=()=>{ls("cm-"+SID,S);ls("cm-g",G)};
const VEN=()=>S.ven.filter(v=>!v.del),REA=()=>S.rea.filter(r=>!r.del);
const nowT=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fT=t=>t?(t.length>10?dfr(t.slice(0,10)).slice(0,5)+" à "+t.slice(11,16):dfr(t).slice(0,5)):"";
const ben=(x,T)=>(T.unk&&T.unk===VEN().length)?'<span style="font-size:22px">Montant d’achat non inséré</span>':fmt(x);
const forms=()=>({v:{a:S.art[0]?S.art[0].n:"",q:1,c:SC().can[0],p:"",cred:false,cl:""},r:{a:S.art[0]?S.art[0].n:"__new",k:1,pp:10,pk:"",pv:"",nn:"",cap:"",capT:"",ing:"",nb:1,ex:""},d:{c:cats()[0],m:"",t:""}});
load();F=forms();
let toastT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),2400)}
const dfr=d=>d.split("-").reverse().join("/");
const ld=t=>{const p=n=>String(n).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())};
const wk=d=>{const t=new Date(d+"T00:00");t.setDate(t.getDate()-(t.getDay()+6)%7);return ld(t)};
function hdr(){$("hn").textContent=SECS[SID].n+" · "+(G.nom||"Ma boutique");$("sec").style.display=FIX?"none":""}
function setSec(id){chosen=true;SID=id;ls("cm-sec",id);load();F=forms();tab="home";render()}

function calc(){const sc=SC(),A={},sum=(l,f)=>l.reduce((s,x)=>s+f(x),0);
 S.art.forEach(a=>{const rs=REA().filter(r=>r.a===a.n),sv=VEN().filter(v=>v.a===a.n);
  const lots=rs.map(r=>({q:r.k*r.pp,u:r.pk!=null?r.pk/r.pp:a.pa})).filter(l=>l.q>0),tot=sum(lots,l=>l.q);
  let cm=a.pa;if(sc.stock&&lots.length)cm=lots.every(l=>l.u!=null)?sum(lots,l=>l.q*l.u)/tot:null;
  const st=sum(rs,r=>r.k*r.pp)-sum(sv,v=>v.q),has=cm!=null;
  A[a.n]={...a,cm,st,ca:sum(sv,v=>v.q*v.p),val:sc.stock&&has?st*cm:0,exp:sc.stock&&has&&a.pv!=null?st*(a.pv-cm):0,low:!!sc.stock&&st<=a.seuil}});
 const T={A,ventes:sum(VEN(),v=>v.q*v.p),dep:sum(S.dep,d=>d.m),brut:0,unk:0,nb:sum(VEN(),v=>v.q)};
 VEN().forEach(v=>{const m=A[v.a]?A[v.a].cm:null;if(m==null)T.unk++;else T.brut+=v.q*(v.p-m)});
 T.net=T.brut-T.dep;const L=Object.values(A);T.val=sum(L,a=>a.val);T.exp=sum(L,a=>a.exp);
 T.vj=sum(VEN().filter(v=>v.d===today()),v=>v.q*v.p);T.dj=sum(S.dep.filter(d=>d.d===today()),d=>d.m);T.aj=sum(REA().filter(r=>r.d===today()),r=>r.k*(r.pk||0));T.crj=sum(VEN().filter(v=>v.d===today()&&v.cr),v=>v.q*v.p);T.encj=sum(S.pay.filter(p=>p.d===today()),p=>p.m);T.cash=T.vj-T.crj+T.encj-T.dj-T.aj;return T}

const SV=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
const IC={home:SV('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),vente:SV('<path d="M3 4h2l2.2 10.5a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L19.5 8H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>'),stock:SV('<path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>'),plat:SV('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'),dep:SV('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/>'),bilan:SV('<path d="M5 20V10M12 20V4M19 20v-7"/>')};
const tabs=()=>[["home",IC.home,"Accueil"],["vente",IC.vente,"Vente"],["reap",SC().stock?IC.stock:IC.plat,SC().stock?"Réappro":"Plats"],["dep",IC.dep,"Dépense"],["bilan",IC.bilan,"Bilan"]];
function go(t){tab=t;ED=null;render();window.scrollTo(0,0)}
const DESC={mode:["👗","Vêtements, accessoires","achats en packs · ventes par canal"],beauty:["💄","Cosmétiques, pommades, maquillage","achats en packs · ventes par canal"],phone:["📱","Téléphones","un article par modèle et par capacité"],resto:["🍲","Cuisine, plats, restauration","coût par lot d’ingrédients · dettes clients"],general:["🛒","Autre commerce","achats à la pièce · dettes clients"]};
function choose(){return `<div class="card" style="margin-top:6px"><h2>Quelle est votre activité ?</h2><p class="k" style="margin:0">Choisissez avant de commencer. Vous pourrez changer avec le menu en haut à droite : chaque activité garde ses propres données.</p>${Object.keys(DESC).map(k=>`<button class="ghost" style="width:100%;text-align:left;padding:14px;margin-top:10px;display:flex;gap:12px;align-items:center" onclick="setSec('${k}')"><span style="font-size:24px;width:48px;height:48px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none">${DESC[k][0]}</span><span><b>${SECS[k].n}</b><span class="k" style="display:block">${DESC[k][1]} · ${DESC[k][2]}</span></span></button>`).join("")}<p class="note" style="text-align:center">Version 11</p></div>`}
function render(){if(!chosen){$("hn").textContent="Bienvenue";$("sec").style.display="none";$("nav").innerHTML="";$("v").innerHTML=choose();return}hdr();$("sec").innerHTML=Object.keys(SECS).map(k=>`<option value="${k}" ${k===SID?"selected":""}>${SECS[k].n}</option>`).join("");
 $("nav").innerHTML=tabs().map(t=>`<button class="${t[0]===tab?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
 $("v").innerHTML=({home,vente,reap,dep,bilan})[tab]()}
const opts=(list,sel)=>list.map(n=>`<option ${n===sel?"selected":""}>${esc(n)}</option>`).join("");
const chips=(list,sel,fn)=>`<div class="chips">${list.map(c=>`<button type="button" class="chip ${c===sel?"on":""}" onclick="${fn}('${c}')">${c}</button>`).join("")}</div>`;
const barRow=(l,v,m)=>`<div style="margin-bottom:8px"><div class="row" style="border:0;padding:0"><span>${esc(l)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${m?Math.max(0,v/m*100):0}%"></i></div></div>`;

function home(){const T=calc(),sc=SC(),arts=Object.values(T.A);
 const top=[...arts].sort((a,b)=>b.ca-a.ca).filter(a=>a.ca>0).slice(0,5),mx=top[0]?top[0].ca:1;
 const can=sc.can.map(c=>[c,VEN().filter(v=>v.c===c).reduce((s,v)=>s+v.q*v.p,0)]),cm=Math.max(1,...can.map(x=>x[1]));
 const miss=arts.some(a=>a.cm==null&&a.st>0),low=arts.filter(a=>a.low),rent=sc.stock?[]:arts.filter(a=>a.cm!=null&&a.pv!=null&&a.pv>a.cm);
 return `${demo()}<div class="hero"><div class="k" style="color:#fff;opacity:.8">Bénéfice net (après dépenses)</div><div class="big">${ben(T.net,T)}</div><p>Vendu aujourd’hui : <b>${fmt(T.vj)}</b> · Dépensé : ${fmt(T.dj)}</p>${T.unk?`<p style="margin-top:8px;color:var(--acc)">Montant d’achat non inséré sur ${T.unk} vente(s) : bénéfice incomplet. À renseigner dans Bilan.</p>`:""}</div>
 <div class="grid"><div class="card"><div class="k">Ventes jusqu’à présent</div><div class="v">${fmt(T.ventes)}</div></div><div class="card"><div class="k">Dépenses</div><div class="v">${fmt(T.dep)}</div></div>
 ${sc.stock?`<div class="card"><div class="k">Valeur du stock</div><div class="v">${miss?'<span style="font-size:14px">Montant d’achat non inséré</span>':fmt(T.val)}</div></div><div class="card"><div class="k">Bénéfice attendu sur le stock</div><div class="v pos">${miss?'<span style="font-size:14px" class="neg">Montant d’achat non inséré</span>':fmt(T.exp)}</div></div>`:`<div class="card"><div class="k">${sc.art}s vendus</div><div class="v">${T.nb}</div></div><div class="card"><div class="k">Bénéfice brut</div><div class="v pos">${ben(T.brut,T)}</div></div>`}</div>
 ${sc.dette?dcard(0):""}${low.length?`<div class="card"><h2>À racheter bientôt</h2>${low.map(a=>`<div class="row"><span>${esc(a.n)}</span><span class="tag">${a.st} en stock</span></div>`).join("")}</div>`:""}
 ${rent.length?`<div class="card"><h2>Pour couvrir vos dépenses (${fmt(T.dep)})</h2>${rent.map(a=>`<div class="row"><span>${esc(a.n)}</span><b>${Math.ceil(T.dep/(a.pv-a.cm))} à vendre</b></div>`).join("")}</div>`:""}
 <div class="card"><h2>Top 5 des ${sc.art.toLowerCase()}s</h2>${top.length?top.map(a=>barRow(a.n,a.ca,mx)).join(""):"<p class='k'>Enregistrez une vente pour voir vos meilleures ventes.</p>"}</div>
 <div class="card"><h2>Ventes par canal</h2>${can.map(c=>barRow(c[0],c[1],cm)).join("")}</div>`}

function vtot(){const f=F.v,a=calc().A[f.a],p=f.p!==""?+f.p:(a&&a.pv!=null?a.pv:null);return{p,t:f.q*(p||0),a}}
function vente(){const sc=SC();if(!S.art.some(x=>x.n===F.v.a))F.v.a=S.art[0]?S.art[0].n:"";const f=F.v,{t,a}=vtot(),hasPv=a&&a.pv!=null;
 return `${S.art.length?"":`<div class="card" style="border-color:var(--acc)"><b>Aucun ${sc.art.toLowerCase()} pour l’instant.</b><div class="k">${sc.stock?"Allez dans Réappro, puis « + Nouvel article » :":"Allez dans Plats :"} créez le premier, puis revenez ici.</div></div>`}<div class="card"><h2>Nouvelle vente</h2>
 <label for="va">${sc.art}</label><select id="va" onchange="F.v.a=this.value;F.v.p='';render()">${opts(S.art.map(a=>a.n),f.a)}</select>
 ${a?`<div class="note">${sc.stock?"En stock : "+a.st+" pièces":""}${sc.stock&&hasPv?" · ":""}${hasPv?"Prix : "+fmt(a.pv):""}</div>`:""}
 <label for="vq">Quantité</label><div class="qty"><button class="ghost" onclick="F.v.q=Math.max(-99,F.v.q-1);render()" aria-label="Moins">−</button><input id="vq" type="number" inputmode="numeric" value="${f.q}" oninput="F.v.q=+this.value;vupd()"><button class="ghost" onclick="F.v.q+=1;render()" aria-label="Plus">+</button></div>
 <label>Canal de vente</label>${chips(sc.can,f.c,"setC")}${sc.dette?`<label>Paiement</label>${chips(["Payé","À crédit"],f.cred?"À crédit":"Payé","setCr")}${f.cred?`<label for="vc">Nom du client</label><input id="vc" value="${esc(f.cl)}" oninput="F.v.cl=this.value">`:""}`:""}
 <label for="vp">Prix de vente (par pièce)</label><input id="vp" type="number" inputmode="numeric" placeholder="Ex : 5000" value="${f.p!==""?f.p:(hasPv?a.pv:"")}" oninput="F.v.p=this.value;vupd()">
 <div class="note" id="vd">${vdiff(vtot())}</div><button class="ghost" style="padding:6px 10px;margin-top:8px" onclick="goPrix()">Modifier les prix</button>
 <div class="sum"><span>Total</span><span id="vt">${fmt(t)}</span></div>
 <button class="btn" onclick="addV()">Enregistrer la vente</button>
 <p class="note">Erreur de saisie ? Utilisez « Corriger » ci-dessous, ou saisissez une quantité négative.</p></div>
 ${vlist()}`}
function setC(c){F.v.c=c;render()}
function setCr(c){F.v.cred=c==="À crédit";render()}
function setCap(c){F.r.cap=c==="Sans"?"":c;render()}
function vdiff(r){return r.a&&r.a.pv!=null&&r.p!=null&&r.p!==r.a.pv?"Vendu "+(r.p<r.a.pv?"moins cher":"plus cher")+" que le prix affiché ("+fmt(r.a.pv)+")":""}
function vupd(){const r=vtot();$("vt").textContent=fmt(r.t);$("vd").textContent=vdiff(r)}

function addV(){if(ferme())return;if(ACT&&!G.lic&&VEN().length>=DEMO){toast("Limite de la démo atteinte : activez l’application");go("bilan");return}
 const f=F.v,{p,a}=vtot();if(!f.a||!f.q)return toast("Choisissez un "+SC().art.toLowerCase()+" et une quantité");if(p==null)return toast("Saisissez le prix de vente");if(f.cred&&!f.cl.trim())return toast("Écrivez le nom du client");
 if(a&&SC().stock&&f.q>a.st&&f.q>0)toast("Attention : stock insuffisant ("+a.st+")");else toast("Vente enregistrée : "+fmt(f.q*p));
 S.ven.push({d:today(),t:nowT(),a:f.a,c:f.c,q:f.q,p,...(f.cred?{cr:f.cl.trim()}:{})});save();F.v.q=1;F.v.p="";F.v.cred=false;F.v.cl="";render()}

const moreBtn=(k,n)=>n>8?`<button class="ghost" style="width:100%;padding:10px;margin-top:10px" onclick="MORE.${k}=!MORE.${k};render()">${MORE[k]?"Voir moins":"Voir tout ("+n+")"}</button>`:"";
function vdesc(v){return v.a+" × "+v.q+" à "+fmt(v.p)+" · "+v.c+(v.cr!=null?" · client "+v.cr:"")}
function vlist(){const all=S.ven.map((v,i)=>[v,i]).reverse(),L=MORE.v?all:all.slice(0,8);return `<div class="card"><h2>Ventes enregistrées</h2>${L.map(x=>vrow(x[0],x[1])).join("")||"<p class='k'>Aucune vente pour l’instant.</p>"}${moreBtn("v",all.length)}</div>`}
function vrow(v,i){const ed=ED&&ED.k==="v"&&ED.i===i,m=v.del?";opacity:.55":"";return `<div class="row" style="flex-wrap:wrap${m}"><span style="flex:1">${v.del?"<s>":""}${esc(v.a)} × ${v.q}${v.del?"</s>":""}<small>${fT(v.t||v.d)} · ${v.c}${v.cr?" · crédit "+esc(v.cr):""}${v.del?" · supprimée":""}</small></span><span class="${v.q<0?"neg":""}">${v.del?"<s>"+fmt(v.q*v.p)+"</s>":fmt(v.q*v.p)}</span>${v.del||ed?"":`<button class="ghost" style="padding:6px 10px" onclick="edOpen('v',${i})">Modifier</button>`}<div style="width:100%">${logHtml(v)}${ed?vform(v,i):""}</div></div>`}
function vform(v,i){return `<div style="background:var(--chip);border-radius:16px;padding:12px;margin-top:8px"><label style="margin-top:0">Quantité</label><input id="evq" type="number" inputmode="numeric" value="${v.q}"><label>Prix de vente (par pièce)</label><input id="evp" type="number" inputmode="numeric" value="${v.p}"><label>Canal</label><select id="evc">${opts(SC().can,v.c)}</select>${v.cr!=null?`<label>Nom du client (crédit)</label><input id="evl" value="${esc(v.cr)}">`:""}<button class="btn" style="margin-top:12px;padding:13px" onclick="edSaveV(${i})">Enregistrer la modification</button><button class="ghost" style="width:100%;padding:12px;margin-top:8px" onclick="edDel('v',${i})">Supprimer cette vente</button><button class="ghost" style="width:100%;padding:12px;margin-top:8px" onclick="ED=null;render()">Fermer</button></div>`}
function edOpen(k,i){if(blocked(k==="v"?S.ven[i]:S.rea[i]))return;ED={k,i};render()}
function edSaveV(i){const v=S.ven[i];if(blocked(v))return;const q=+$("evq").value,p=$("evp").value,c=$("evc").value,cl=$("evl")?$("evl").value.trim():null;
 if(!q||p===""||+p<=0)return toast("La quantité et le prix de vente sont obligatoires");if(cl!==null&&!cl)return toast("Écrivez le nom du client");
 if(q===v.q&&+p===v.p&&c===v.c&&(cl===null||cl===v.cr))return toast("Aucun changement");
 v.log=(v.log||[]).concat([{t:nowT(),act:"Modifiée",av:vdesc(v)}]);v.q=q;v.p=+p;v.c=c;if(cl!==null)v.cr=cl;save();ED=null;toast("Vente modifiée");render()}
function rdesc(r){const sc=SC();return r.a+" : "+(sc.pack?r.k+" pack(s) × "+r.pp+" pièces":r.k+" pièce(s)")+" · "+(r.pk!=null?(sc.pack?"prix du pack ":"prix d’une pièce ")+fmt(r.pk):"prix non noté")}
function rlist(){const all=S.rea.map((r,i)=>[r,i]).reverse(),L=MORE.r?all:all.slice(0,8);return `<div class="card"><h2>Achats enregistrés</h2>${L.map(x=>rrow(x[0],x[1])).join("")||"<p class='k'>Aucun achat pour l’instant.</p>"}${moreBtn("r",all.length)}</div>`}
function rrow(r,i){const sc=SC(),ed=ED&&ED.k==="r"&&ED.i===i,m=r.del?";opacity:.55":"";return `<div class="row" style="flex-wrap:wrap${m}"><span style="flex:1">${r.del?"<s>":""}${esc(r.a)}${r.del?"</s>":""}<small>${fT(r.t||r.d)} · ${sc.pack?r.k+" pack(s) × "+r.pp+" pièces":r.k+" pièce(s)"}${r.del?" · supprimé":""}</small></span><span>${r.pk!=null?fmt(r.k*r.pk):"prix non noté"}</span>${r.del||ed?"":`<button class="ghost" style="padding:6px 10px" onclick="edOpen('r',${i})">Modifier</button>`}<div style="width:100%">${logHtml(r)}${ed?rform(r,i):""}</div></div>`}
function rform(r,i){const sc=SC();return `<div style="background:var(--chip);border-radius:16px;padding:12px;margin-top:8px"><label style="margin-top:0">${sc.pack?"Nombre de packs":"Quantité reçue"}</label><input id="erk" type="number" inputmode="numeric" value="${r.k}">${sc.pack?`<label>Pièces par pack</label><input id="erp" type="number" inputmode="numeric" value="${r.pp}">`:""}<label>${sc.pack?"Prix du pack":"Prix d’achat d’une pièce"} <span class="k">(facultatif)</span></label><input id="erq" type="number" inputmode="numeric" value="${r.pk==null?"":r.pk}"><button class="btn" style="margin-top:12px;padding:13px" onclick="edSaveR(${i})">Enregistrer la modification</button><button class="ghost" style="width:100%;padding:12px;margin-top:8px" onclick="edDel('r',${i})">Supprimer cet achat</button><button class="ghost" style="width:100%;padding:12px;margin-top:8px" onclick="ED=null;render()">Fermer</button></div>`}
function edSaveR(i){const r=S.rea[i];if(blocked(r))return;const sc=SC(),k=+$("erk").value,pp=sc.pack?+$("erp").value:1,pv=$("erq").value,pk=pv===""?null:+pv;
 if(!k||!pp)return toast("Indiquez la quantité");if(k===r.k&&pp===r.pp&&pk===r.pk)return toast("Aucun changement");
 r.log=(r.log||[]).concat([{t:nowT(),act:"Modifié",av:rdesc(r)}]);r.k=k;r.pp=pp;r.pk=pk;save();ED=null;toast("Achat modifié");render()}
function edDel(k,i){const r=k==="v"?S.ven[i]:S.rea[i];if(blocked(r))return;const key=k+i;
 if(dc!==key){dc=key;toast("Appuyez encore pour confirmer la suppression");setTimeout(()=>{if(dc===key)dc=null},4000);return}
 dc=null;r.log=(r.log||[]).concat([{t:nowT(),act:"Supprimé"+(k==="v"?"e":""),av:k==="v"?vdesc(r):rdesc(r)}]);r.del=true;save();ED=null;toast((k==="v"?"Vente supprimée":"Achat supprimé")+" (conservé dans l’historique)");render()}

function rcalc(){const f=F.r,sc=SC(),a=calc().A[f.a],neu=f.a==="__new",pk=f.pk===""?null:+f.pk,pcs=f.k*(sc.pack?f.pp:1),cu=pk!=null&&pcs?f.k*pk/pcs:null,pv=f.pv===""?(a&&!neu?a.pv:null):+f.pv;return{pcs,cu,gain:cu!=null&&pv!=null?pv-cu:null,a,neu}}
function reap(){return SC().stock?reapS():plats()}
function reapS(){const f=F.r,sc=SC();if(f.a!=="__new"&&!S.art.some(x=>x.n===f.a))F.r.a=S.art[0]?S.art[0].n:"__new";const {pcs,cu,gain,a,neu}=rcalc(),fac=' <span class="k">(facultatif)</span>';
 return `<div class="card"><h2>Réapprovisionnement</h2>
 <label for="ra">${sc.art}</label><select id="ra" onchange="F.r.a=this.value;F.r.pv='';render()">${S.art.map(x=>`<option value="${esc(x.n)}" ${x.n===F.r.a?"selected":""}>${esc(x.n)}</option>`).join("")}<option value="__new" ${F.r.a==="__new"?"selected":""}>+ Nouvel ${sc.art.toLowerCase()}</option></select>
 ${F.r.a==="__new"?`<label for="rn">${sc.cap?"Modèle (ex : Samsung A15)":"Nom"}</label><input id="rn" value="${esc(f.nn)}" oninput="F.r.nn=this.value">`:""}
 ${F.r.a==="__new"&&sc.cap?`<label>Capacité de stockage</label>${chips(["Sans","32 Go","64 Go","128 Go","256 Go","512 Go","Autre"],f.cap||"Sans","setCap")}${f.cap==="Autre"?`<input id="rc" placeholder="Ex : 1 To ou 16 Go" value="${esc(f.capT)}" oninput="F.r.capT=this.value" style="margin-top:8px">`:""}`:""}
 <label for="rk">${sc.pack?"Nombre de packs":"Quantité reçue"}</label><input id="rk" type="number" inputmode="numeric" value="${f.k}" oninput="F.r.k=+this.value;rupd()">
 ${sc.pack?`<label for="rp">Pièces par pack</label><input id="rp" type="number" inputmode="numeric" value="${f.pp}" oninput="F.r.pp=+this.value;rupd()">`:""}
 <label for="rq">${sc.pack?"Prix du pack":"Prix d’achat d’une pièce"}${fac}</label><input id="rq" type="number" inputmode="numeric" placeholder="Vous pouvez le laisser vide" value="${f.pk}" oninput="F.r.pk=this.value;rupd()">
 <label for="rv">Prix de vente d’une pièce <span class="k">(obligatoire)</span></label><input id="rv" type="number" inputmode="numeric" placeholder="${a&&!neu&&a.pv!=null?a.pv:"Ex : 12000"}" value="${f.pv}" oninput="F.r.pv=this.value;rupd()">
 <div class="sum"><span>Pièces reçues</span><span id="r1">${pcs}</span></div>
 <div class="sum" style="margin-top:6px"><span>Coût d’une pièce</span><span id="r2">${cu==null?"—":fmt(cu)}</span></div>
 <div class="sum" style="margin-top:6px"><span>Gain par pièce</span><span id="r3">${gain==null?"—":fmt(gain)}</span></div>
 <button class="btn" onclick="addR()">Enregistrer le réappro</button>
 <p class="note">Le prix d’achat peut être renseigné plus tard par le patron, dans Bilan : le bénéfice se recalcule alors sur toutes les ventes passées.</p></div>
 ${rlist()}`}
function rupd(){const {pcs,cu,gain}=rcalc();$("r1").textContent=pcs;$("r2").textContent=cu==null?"—":fmt(cu);$("r3").textContent=gain==null?"—":fmt(gain)}
function addR(){if(ferme())return;const f=F.r,sc=SC(),pp=sc.pack?f.pp:1;let n=f.a;if(!f.k||!pp)return toast("Indiquez la quantité");{const ex0=f.a==="__new"?null:S.art.find(a=>a.n===f.a);if((f.pv===""||+f.pv<=0)&&(!ex0||ex0.pv==null))return toast("Le prix de vente est obligatoire")}const pk=f.pk===""?null:+f.pk;
 if(n==="__new"){n=f.nn.trim();if(!n)return toast("Donnez un nom");if(sc.cap&&f.cap==="Autre"&&!f.capT.trim())return toast("Écrivez la capacité de stockage");if(sc.cap&&f.cap)n+=" "+(f.cap==="Autre"?f.capT.trim():f.cap);if(S.art.some(a=>a.n===n))return toast("Cet article existe déjà");S.art.push({n,pa:null,pv:f.pv===""?null:+f.pv,seuil:3})}else if(f.pv!=="")S.art.find(a=>a.n===n).pv=+f.pv;
 S.rea.push({d:today(),t:nowT(),a:n,k:f.k,pp,pk});save();toast("Réappro enregistré");F.r={a:n,k:1,pp:10,pk:"",pv:"",nn:"",cap:"",capT:"",ing:"",nb:1,ex:""};render()}
function dettes(){const m={};VEN().forEach(v=>{if(v.cr)m[v.cr]=(m[v.cr]||0)+v.q*v.p});S.pay.forEach(p=>{m[p.cl]=(m[p.cl]||0)-p.m});return Object.entries(m).filter(e=>e[1]>0.5)}

function pupd(){const c=pc(),pv=F.r.pv===""?null:+F.r.pv;$("p1").textContent=c==null?"—":fmt(c);$("p2").textContent=c==null||pv==null?"—":fmt(pv-c)}
